<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315844">
<title>Calf Keeper</title>
<style>
:root{--bg:#f7f5ee;--card:#fffdf8;--ink:#07131a;--muted:#66756d;--green:#005b3b;--sage:#dcead6;--red:#a94242;--amber:#9b6a20;--line:#dfe4da}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:10px 16px;position:sticky;top:0;background:rgba(247,245,238,.97);z-index:5;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.brandLogo{width:54px;height:54px;border-radius:13px;object-fit:cover}.brandText{min-width:0}
h1{font-size:24px;margin:0} .sub{color:var(--muted);font-size:13px;margin-top:3px}
main{padding:14px 14px 100px;max-width:760px;margin:auto}.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #00000008}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grow{flex:1}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--sage);font-size:12px}.bad{background:#f5dede;color:#7e2727}.due{background:#f7e8c8;color:#77501c}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:650;background:var(--green);color:white}button.secondary{background:#edf1ed;color:var(--ink)}button.danger{background:#f6e2e2;color:var(--red)}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd2cc;border-radius:10px;background:#fff;font:inherit;margin:5px 0 10px}textarea{min-height:80px;resize:vertical}
label{font-size:13px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px 10px}
nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:white;color:#66736c;border-radius:0;padding:8px 3px;font-size:11px}nav button.active{color:var(--green)}nav .ico{display:block;font-size:22px;margin-bottom:2px}
#addBtn{background:var(--green);color:#fff;border-radius:20px 0 0 0}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
.sheet h2{margin:0 0 14px}.choices{display:grid;gap:10px}.choices button{font-size:16px;padding:16px;text-align:left}
.sectionTitle{font-size:18px;margin:18px 2px 8px}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.pill{background:#edf1ed;color:var(--ink)}.pill.on{background:var(--green);color:#fff}
.timeline{border-left:2px solid #d8ded8;margin-left:8px;padding-left:14px}.timeline .card{margin:8px 0}
.smallBtns{display:flex;gap:6px;flex-wrap:wrap}.smallBtns button{padding:7px 9px;font-size:12px}
a{color:inherit}.clickable{cursor:pointer}.stat{font-size:25px;font-weight:750}.topstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.topstats .card{text-align:center;padding:10px 4px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.topstats{grid-template-columns:repeat(3,1fr)}}
</style>

 <label>Calf number *</label><input name="number" required value="${esc(c.number)}" inputmode="numeric">
 <label>Name</label><input name="name" value="${esc(c.name)}">
 <div class="grid"><div><label>Sex</label><select name="gender"><option ${(!id||c.gender==='Heifer'||c.gender==='Female')?'selected':''}>Heifer</option><option ${c.gender==='Bull'?'selected':''}>Bull</option><option ${c.gender==='Steer'?'selected':''}>Steer</option></select></div>
 <div><label>Colour</label><select name="colour">
<option value="Light Brown" ${c.colour==='Light Brown'?'selected':''}>Light Brown</option>
<option value="Dark Brown" ${(!id || c.colour==='Brown' || c.colour==='Dark Brown')?'selected':''}>Dark Brown</option>
<option value="Light brown and white" ${c.colour==='Light brown and white'?'selected':''}>Light brown and white</option>
<option value="Dark brown and white" ${c.colour==='Dark brown and white'?'selected':''}>Dark brown and white</option>
<option value="Red" ${c.colour==='Red'?'selected':''}>Red</option>
<option value="Black" ${c.colour==='Black'?'selected':''}>Black</option>
<option value="Black and white" ${c.colour==='Black and white'?'selected':''}>Black and white</option>
<option value="White" ${c.colour==='White'?'selected':''}>White</option>
</select></div></div>
 <label>Date of birth</label><input type="date" name="dob" value="${esc(c.dob)}">
 <label>Group</label><select name="groupId"><option value="">No group</option>${db.groups.map(g=>`<option value="${g.id}" ${c.groupId===g.id?'selected':''}>${esc(g.name)}${g.location?' · '+esc(g.location):''}</option>`).join('')}</select>
 <label>Notes</label><textarea name="notes">${esc(c.notes)}</textarea>
 <div class="card" style="background:#faf7f1">
 <label style="display:flex;align-items:center;gap:10px"><input type="checkbox" name="deceased" value="yes" style="width:auto;margin:0" ${c.deceased?'checked':''} onchange="toggleDeathFields(this.checked)"> Deceased</label>
 <div id="deathFields" style="${c.deceased?'':'display:none'}">
 <label>Date died</label><input type="date" name="deathDate" value="${esc(c.deathDate)}">
 <label>Why / notes</label><textarea name="deathReason" placeholder="Reason the calf died">${esc(c.deathReason)}</textarea>
 </div></div>
 <button>Save calf</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
window.saveCalf=(e,id)=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.year=String(o.year||currentYear);o.deceased=o.deceased==='yes';if(!o.deceased){o.deathDate='';o.deathReason=''}if(o.deceased)o.groupId='';if(id){let c=db.calves.find(x=>x.id===id),wasDeceased=!!c.deceased;Object.assign(c,o);if(wasDeceased&&!o.deceased)c.groupId=''}else db.calves.push({id:uid(),...o,sickness:[]});save();close()}

window.toggleDeathFields=on=>{let el=document.getElementById('deathFields');if(el)el.style.display=on?'block':'none'}
function sicknessForm(calfId,sid){
 const c=db.calves.find(x=>x.id===calfId), s=sid?c.sickness.find(x=>x.id===sid):{};
 open(`<h2>${sid?'Edit':'Mark'} sickness</h2><form onsubmit="saveSick(event,'${calfId}','${sid||''}')">
 <label>Why is the calf sick? *</label><input name="reason" required value="${esc(s.reason)}" placeholder="e.g. Scours, pneumonia">
 <label>Date first noticed *</label><input type="date" name="start" required value="${s.start||today()}">
 <label>Recovered date</label><input type="date" name="end" value="${esc(s.end)}"><div class="muted">Leave blank while the calf is still sick.</div>
 <label>Notes / updates</label><textarea name="notes">${esc(s.notes)}</textarea>
 <button>Save</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
window.saveSick=(e,cid,sid)=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),c=db.calves.find(x=>x.id===cid);if(sid)Object.assign(c.sickness.find(x=>x.id===sid),o);else c.sickness.push({id:uid(),...o});save();close();showProfile(cid)}
window.recover=(cid,sid)=>{let s=db.calves.find(x=>x.id===cid).sickness.find(x=>x.id===sid);s.end=today();save();showProfile(cid)}

function treatmentForm(id, presetCalf=''){
 const t=id?db.treatments.find(x=>x.id===id):{};
 open(`<h2>${id?'Edit':'Add'} treatment 💉</h2><form onsubmit="saveTreatment(event,'${id||''}')">
 <label>Calf number *</label><input name="calfNumber" required value="${esc(t.calfNumber||presetCalf)}" inputmode="numeric" placeholder="Type calf number">
 <label>Medicine / treatment *</label><input name="medicine" required value="${esc(t.medicine)}" placeholder="e.g. antibiotic name">
 <label>Type</label><select name="type"><option ${t.type==='Antibiotic'?'selected':''}>Antibiotic</option><option ${t.type==='Anti-inflammatory'?'selected':''}>Anti-inflammatory</option><option ${t.type==='Other medicine'?'selected':''}>Other medicine</option></select>
 <div class="grid"><div><label>Amount per treatment *</label><input type="number" step="0.01" min="0" name="amount" required value="${esc(t.amount)}"></div>
 <div><label>Unit *</label><select name="unit"><option ${t.unit==='ml'?'selected':''}>ml</option><option ${t.unit==='grams'?'selected':''}>grams</option><option ${t.unit==='tubes'?'selected':''}>tubes</option></select></div></div>
 <label>How many treatments are needed? *</label><input type="number" min="1" name="needed" required value="${esc(t.needed||1)}">
 <label>Start date</label><input type="date" name="start" value="${t.start||today()}">
 <label>Instructions / notes</label><textarea name="notes">${esc(t.notes)}</textarea>
 <button>Save treatment</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
window.saveTreatment=(e,id)=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let calf=db.calves.find(c=>String(c.number).trim()===String(o.calfNumber).trim()&&calfYear(c)===currentYear);if(calf&&calf.deceased){alert('This calf is marked deceased. Change the calf to not deceased before adding or editing treatment.');return}o.needed=+o.needed;o.amount=+o.amount;if(id)Object.assign(db.treatments.find(x=>x.id===id),o);else db.treatments.push({id:uid(),...o,given:[]});save();close()}
window.giveDose=id=>{let t=db.treatments.find(x=>x.id===id),c=db.calves.find(x=>String(x.number).trim()===String(t.calfNumber).trim()&&calfYear(x)===currentYear);if(c&&c.deceased){alert('This calf is marked deceased. Treatment cannot be given unless the calf is changed to not deceased.');return}if(t.given.length<t.needed)t.given.push({id:uid(),date:today()});save()}
window.undoDose=(id,gid)=>{let t=db.treatments.find(x=>x.id===id);t.given=t.given.filter(x=>x.id!==gid);save()}


function groupForm(id){
 const g=id?db.groups.find(x=>x.id===id):{};
 open(`<h2>${id?'Edit':'Add'} group 📍</h2><form onsubmit="saveGroup(event,'${id||''}')">
 <label>Group name *</label><input name="name" required value="${esc(g.name)}" placeholder="e.g. Shed Calves">
 <label>Current location</label><input name="location" value="${esc(g.location)}" placeholder="e.g. North Paddock">
 <label>Notes</label><textarea name="notes">${esc(g.notes)}</textarea>
 <button>Save group</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
window.saveGroup=(e,id)=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(id)Object.assign(db.groups.find(x=>x.id===id),o);else db.groups.push({id:uid(),...o});save();close();nav('groups')}
window.deleteGroup=id=>{if(!confirm('Delete this group? Calves will stay saved but will no longer be assigned to it.'))return;db.calves.forEach(c=>{if(c.groupId===id)c.groupId=''});db.groups=db.groups.filter(g=>g.id!==id);currentGroup=null;save()}
window.showGroup=id=>{currentGroup=id;renderGroups()}

function moveCalvesForm(sourceId=''){
 const isUnassigned=sourceId==='UNASSIGNED';
 const source=sourceId&&!isUnassigned?db.groups.find(g=>g.id===sourceId):null;
 const calves=(isUnassigned?db.calves.filter(c=>!c.groupId&&!c.deceased):source?db.calves.filter(c=>c.groupId===sourceId&&!c.deceased):db.calves.filter(c=>calfYear(c)===currentYear&&!c.deceased))
   .sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
 open(`<h2>Move calves 📍</h2>
 <form onsubmit="moveSelectedCalves(event)">
 ${isUnassigned?`<div class="card"><b>From Unassigned</b><div class="muted">${calves.length} calves waiting for a group</div></div>`:source?`<div class="card"><b>From ${esc(source.name)}</b><div class="muted">${esc(source.location||'No location set')} · ${calves.length} calves</div></div>`:`<div class="muted">Showing ${esc(currentYear)} calves.</div>`}
 <div class="row"><b>Select calves to move</b><button type="button" class="secondary" onclick="toggleMoveAll(true)">Select all</button></div>
 <div style="max-height:42vh;overflow:auto;margin:10px 0">${calves.length?calves.map(c=>`<label class="card row" style="justify-content:flex-start;margin:6px 0"><input class="moveCheck" type="checkbox" name="calfIds" value="${c.id}" style="width:auto;margin:0 10px 0 0"><span><b>#${esc(c.number)} ${esc(c.name||'')}</b><span class="muted" style="display:block">${esc(c.gender||'')} ${c.colour?'· '+esc(c.colour):''}</span></span></label>`).join(''):'<div class="empty">No calves in this group.</div>'}</div>
 <label>Move selected calves to *</label>
 <select name="target" required><option value="">Choose group…</option>${db.groups.filter(g=>g.id!==sourceId).map(g=>`<option value="${g.id}">${esc(g.name)}${g.location?' · '+esc(g.location):''}</option>`).join('')}<option value="NONE">No group / unassigned</option></select>
 <button ${calves.length?'':'disabled'}>Move selected calves</button> <button type="button" class="secondary" onclick="close()">Cancel</button>
 </form>`);
}
window.toggleMoveAll=on=>$$('.moveCheck').forEach(x=>x.checked=on)
window.moveSelectedCalves=e=>{
 e.preventDefault();
 let fd=new FormData(e.target), ids=fd.getAll('calfIds'), target=fd.get('target');
 if(!ids.length){alert('Select at least one calf to move.');return}
 ids.forEach(id=>{let c=db.calves.find(x=>x.id===id);if(c)c.groupId=target==='NONE'?'':target});
 save();close();
}
window.moveOne=(calfId,sourceId)=>{
 const c=db.calves.find(x=>x.id===calfId),source=db.groups.find(g=>g.id===sourceId);
 open(`<h2>Move #${esc(c.number)} ${esc(c.name||'')}</h2><form onsubmit="moveOneSave(event,'${c.id}')">
 <div class="muted">Currently in ${esc(source?.name||'No group')}${source?.location?' · '+esc(source.location):''}</div>
 <label>Move to</label><select name="target" required><option value="">Choose group…</option>${db.groups.filter(g=>g.id!==sourceId).map(g=>`<option value="${g.id}">${esc(g.name)}${g.location?' · '+esc(g.location):''}</option>`).join('')}<option value="NONE">No group / unassigned</option></select>
 <button>Move calf</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
window.moveOneSave=(e,cid)=>{e.preventDefault();let target=new FormData(e.target).get('target'),c=db.calves.find(x=>x.id===cid);c.groupId=target==='NONE'?'':target;save();close()}
function assignGroupForm(groupId){
 const g=db.groups.find(x=>x.id===groupId);
 open(`<h2>Add calves to ${esc(g.name)}</h2><form onsubmit="assignGroup(event,'${g.id}')">
 <label>Calf numbers *</label><input name="numbers" required placeholder="e.g. 12, 18, 24">
 <div class="muted">Type one or many calf numbers. Any calf already in another group will be moved here.</div>
 <button>Add / move into group</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
window.assignGroup=(e,gid)=>{e.preventDefault();let nums=new FormData(e.target).get('numbers').split(/[\s,;]+/).filter(Boolean),found=[];nums.forEach(n=>{let c=db.calves.find(x=>String(x.number).trim().toLowerCase()===n.trim().toLowerCase());if(c){c.groupId=gid;found.push(c.number)}});if(!found.length){alert('No matching calf numbers found.');return}save();close()}

function renderGroups(){
 const box=$('#groupList'), detail=$('#groupDetail');
 const unassigned=db.calves.filter(c=>!c.groupId&&!c.deceased).length;
 box.innerHTML=`<div class="card"><div class="row"><div class="grow"><label>Select a group</label><select onchange="showGroup(this.value)"><option value="">Choose group…</option><option value="UNASSIGNED" ${currentGroup==='UNASSIGNED'?'selected':''}>Unassigned — ${unassigned} calves</option>${db.groups.map(g=>`<option value="${g.id}" ${currentGroup===g.id?'selected':''}>${esc(g.name)} — ${db.calves.filter(c=>c.groupId===g.id&&!c.deceased).length} calves</option>`).join('')}</select></div></div><div class="muted">${db.calves.length} calves total · ${unassigned} waiting to be assigned</div></div>`+
 `<div class="card clickable" onclick="showGroup('UNASSIGNED')"><div class="row"><div><b>📍 Unassigned</b><div class="muted">New calves automatically wait here until you move them</div></div><span class="badge">${unassigned} ${unassigned===1?'calf':'calves'}</span></div></div>`+
 (db.groups.length?db.groups.map(g=>{let count=db.calves.filter(c=>c.groupId===g.id&&!c.deceased).length;return `<div class="card clickable" onclick="showGroup('${g.id}')"><div class="row"><div><b>📍 ${esc(g.name)}</b><div class="muted">${esc(g.location||'No location set')}</div></div><span class="badge">${count} ${count===1?'calf':'calves'}</span></div></div>`}).join(''):'');
 if(!currentGroup){detail.innerHTML='';return}
 if(currentGroup==='UNASSIGNED'){
   const members=db.calves.filter(c=>!c.groupId&&!c.deceased).sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
   detail.innerHTML=`<h3 class="sectionTitle">Unassigned · ${members.length} ${members.length===1?'calf':'calves'}</h3>
   <div class="card"><div class="muted">All calves without a group automatically appear here. Select several at once and move them into their mob.</div>
   <div class="smallBtns"><button onclick="moveCalvesForm('UNASSIGNED')">☑ Select & move calves</button></div></div>
   <h3 class="sectionTitle">Calves waiting for a group</h3>${members.length?members.map(c=>`<div class="card"><div class="row"><div class="clickable grow" onclick="showProfile('${c.id}')"><b>#${esc(c.number)} ${esc(c.name||'')}</b><div class="muted">${esc(c.gender||'')} ${c.colour?'· '+esc(c.colour):''}</div></div></div></div>`).join(''):'<div class="empty">Everyone has been assigned to a group. ✓</div>'}`;
   return;
 }
 const g=db.groups.find(x=>x.id===currentGroup);if(!g){detail.innerHTML='';return}
 const members=db.calves.filter(c=>c.groupId===g.id&&!c.deceased).sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
 detail.innerHTML=`<h3 class="sectionTitle">${esc(g.name)} · ${members.length} ${members.length===1?'calf':'calves'}</h3>
 <div class="card"><b>Current location:</b> ${esc(g.location||'Not set')}${g.notes?`<p>${esc(g.notes)}</p>`:''}
 <div class="smallBtns"><button onclick="assignGroupForm('${g.id}')">＋ Add calves by number</button><button onclick="moveCalvesForm('${g.id}')">☑ Select & move calves</button><button class="secondary" onclick="groupForm('${g.id}')">Edit group</button><button class="danger" onclick="deleteGroup('${g.id}')">Delete group</button></div></div>
 <h3 class="sectionTitle">Calves currently here</h3>${members.length?members.map(c=>`<div class="card"><div class="row"><div class="clickable grow" onclick="showProfile('${c.id}')"><b>#${esc(c.number)} ${esc(c.name||'')}</b><div class="muted">${esc(c.gender||'')} ${c.colour?'· '+esc(c.colour):''} · 📍 ${esc(g.location||g.name)}</div></div><button class="secondary" onclick="moveOne('${c.id}','${g.id}')">Move</button></div></div>`).join(''):'<div class="empty">No calves are currently in this group.</div>'}`;
}
window.weeksToDate=el=>{if(el.value==='')return;let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(+el.value*7));let local=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);let dateEl=document.getElementById('careDate');if(dateEl)dateEl.value=local}
function awayText(date){
 if(!date)return 'No date set';
 const a=new Date(today()+'T12:00:00'), b=new Date(date+'T12:00:00');
 const diff=Math.round((b-a)/86400000);
 if(diff<0)return `${Math.abs(diff)} day${Math.abs(diff)===1?'':'s'} overdue`;
 if(diff===0)return 'Due today';
 const w=Math.ceil(diff/7);
 return diff<7?`${diff} day${diff===1?'':'s'} away`:`${w} week${w===1?'':'s'} away`;
}
function careForm(id){
 const c=id?db.care.find(x=>x.id===id):{};
 open(`<h2>${id?'Edit':'Add'} calf care 📖</h2><form onsubmit="saveCare(event,'${id||''}')">
 <label>Care *</label><input name="title" required value="${esc(c.title)}" placeholder="e.g. Drench, vaccination, weigh">
 <label>Who is it for?</label><select name="scope" onchange="careScope(this.value)">
 <option value="herd" ${c.scope==='herd'?'selected':''}>Whole herd</option><option value="count" ${c.scope==='count'?'selected':''}>Number of animals</option><option value="numbers" ${c.scope==='numbers'?'selected':''}>Specific animal numbers</option></select>
 <div id="careScope">${careScopeHTML(c.scope||'herd',c)}</div>
 <label>How many weeks away?</label><input type="number" min="0" step="1" name="weeksAway" value="${esc(c.weeksAway)}" placeholder="e.g. 3" oninput="weeksToDate(this)">
 <div class="muted">Enter weeks and the rough future date will be calculated automatically. You can still change the date below.</div>
 <label>Rough planned date</label><input id="careDate" type="date" name="date" value="${esc(c.date)}">
 <label>Notes / care information</label><textarea name="notes">${esc(c.notes)}</textarea>
 <button>Save care event</button> <button type="button" class="secondary" onclick="close()">Cancel</button></form>`);
}
function careScopeHTML(v,c={}){return v==='count'?`<label>Number of animals</label><input type="number" min="1" name="animalCount" value="${esc(c.animalCount)}">`:v==='numbers'?`<label>Animal numbers</label><input name="animalNumbers" value="${esc(c.animalNumbers)}" placeholder="Type numbers, e.g. 12, 18, 24">`:''}
window.careScope=v=>$('#careScope').innerHTML=careScopeHTML(v,{});
window.saveCare=(e,id)=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(id)Object.assign(db.care.find(x=>x.id===id),o);else db.care.push({id:uid(),...o,done:false,doneDate:''});save();close()}
window.markCare=id=>{let c=db.care.find(x=>x.id===id);c.done=true;c.doneDate=today();save()}
window.undoCare=id=>{let c=db.care.find(x=>x.id===id);c.done=false;c.doneDate='';save()}
window.del=(kind,id)=>{if(!confirm('Delete this record?'))return;if(kind==='calf')db.calves=db.calves.filter(x=>x.id!==id);else db[kind]=db[kind].filter(x=>x.id!==id);save();if(kind==='calf')nav('calves')}

function calfYear(c){return String(c.year||(c.dob?c.dob.slice(0,4):'Unassigned'))}
function yearsAvailable(){
 let ys=[...new Set(db.calves.map(c=>calfYear(c)).filter(y=>y!=='Unassigned'))];
 ys.push(currentYear);
 return [...new Set(ys)].sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
}
window.setYear=y=>{currentYear=y;localStorage.setItem('moologYear',y);renderAll()}
function renderYearSelect(){
 let el=$('#yearSelect'); if(!el)return;
 el.innerHTML=yearsAvailable().map(y=>`<option value="${esc(y)}" ${y===currentYear?'selected':''}>${esc(y)} calves</option>`).join('');
}
function renderCalves(){
 renderYearSelect();
 let yearCalves=db.calves.filter(c=>calfYear(c)===currentYear);
 let sick=yearCalves.filter(c=>(c.sickness||[]).some(s=>!s.end)).length;
 let nums=new Set(yearCalves.map(c=>String(c.number).trim()));
 let activeTreat=db.treatments.filter(t=>nums.has(String(t.calfNumber).trim())&&t.given.length<t.needed).length;
 $('#calfStats').innerHTML=`<div class="topstats"><div class="card"><div class="stat">${yearCalves.length}</div><div class="muted">${esc(currentYear)} calves</div></div><div class="card"><div class="stat">${sick}</div><div class="muted">Sick</div></div><div class="card"><div class="stat">${activeTreat}</div><div class="muted">Treatments</div></div></div>`;
 $('#calfList').innerHTML=yearCalves.length?yearCalves.slice().sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true})).map(c=>{
 let sk=(c.sickness||[]).find(x=>!x.end),g=db.groups.find(x=>x.id===c.groupId);
 return `<div class="card clickable" onclick="showProfile('${c.id}')"><div class="row"><div><b>#${esc(c.number)} ${esc(c.name||'')}</b><div class="muted">${esc(c.gender||'')} ${c.colour?'· '+esc(c.colour):''}${g?' · 📍 '+esc(g.name)+(g.location?' — '+esc(g.location):''):''}</div></div>${c.deceased?'<span class="badge bad">Deceased</span>':sk?`<span class="badge bad">Sick · ${esc(sk.reason)}</span>`:'<span class="badge">Healthy</span>'}</div></div>`}).join(''):`<div class="empty">No calves recorded for ${esc(currentYear)}.<br>Tap <b>+ Add</b> to add one.</div>`;
}
window.showProfile=id=>{currentCalf=id;renderProfile();nav('profile')}
function renderProfile(){
 const c=db.calves.find(x=>x.id===currentCalf);if(!c)return;
 let sickness=(c.sickness||[]).slice().sort((a,b)=>b.start.localeCompare(a.start));
 let trs=db.treatments.filter(t=>String(t.calfNumber).trim()===String(c.number).trim()).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
 let grp=db.groups.find(g=>g.id===c.groupId);
 $('#profileContent').innerHTML=`<button class="secondary" onclick="nav('calves')">← Back</button>
 <div class="card"><div class="row"><div><h2 style="margin:0">#${esc(c.number)} ${esc(c.name||'')}</h2><div class="muted">${esc(c.gender||'')} ${c.colour?'· '+esc(c.colour):''} ${c.dob?'· Born '+fmt(c.dob):''}</div>${grp?`<div class="muted">📍 ${esc(grp.name)}${grp.location?' · '+esc(grp.location):''}</div>`:''}${c.deceased?`<div class="muted" style="color:var(--red)">Deceased${c.deathDate?' · '+fmt(c.deathDate):''}${c.deathReason?' · '+esc(c.deathReason):''}</div>`:''}</div></div>${c.notes?`<p>${esc(c.notes)}</p>`:''}
 <div class="smallBtns"><button onclick="calfForm('${c.id}')">Edit calf</button>${c.deceased?'':`<button class="secondary" onclick="sicknessForm('${c.id}')">🤒 Mark sick</button><button class="secondary" onclick="treatmentForm('','${esc(c.number)}')">💉 Treatment</button>`}<button class="danger" onclick="del('calf','${c.id}')">Delete</button></div>${c.deceased?'<div class="muted" style="margin-top:10px">This calf is deceased. Health and treatment actions are locked until it is changed to not deceased.</div>':''}</div>
 <h3 class="sectionTitle">🤒 Sickness history</h3>${sickness.length?sickness.map(s=>`<div class="card"><div class="row"><div><b>${esc(s.reason)}</b><div class="muted">${fmt(s.start)} ${s.end?'→ '+fmt(s.end)+' · '+days(s.start,s.end)+' days':'· Sick for '+days(s.start)+' days'}</div></div><span class="badge ${s.end?'':'bad'}">${s.end?'Recovered':'Current'}</span></div>${s.notes?`<p>${esc(s.notes)}</p>`:''}<div class="smallBtns">${!s.end?`<button onclick="recover('${c.id}','${s.id}')">Mark recovered</button>`:''}<button class="secondary" onclick="sicknessForm('${c.id}','${s.id}')">Edit</button><button class="danger" onclick="deleteSick('${c.id}','${s.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No sickness recorded.</div>'}
 <h3 class="sectionTitle">💉 Treatment history</h3>${trs.length?trs.map(t=>treatmentCard(t,true)).join(''):'<div class="empty">No treatments recorded for this calf.</div>'}`;
}
window.deleteSick=(cid,sid)=>{if(confirm('Delete this sickness record?')){let c=db.calves.find(x=>x.id===cid);c.sickness=c.sickness.filter(x=>x.id!==sid);save();showProfile(cid)}}

function treatmentCard(t,profile=false){
 let complete=t.given.length>=t.needed;
 return `<div class="card"><div class="row"><div><b>#${esc(t.calfNumber)} · ${esc(t.medicine)}</b><div class="muted">${esc(t.type)} · ${esc(t.amount)} ${esc(t.unit)} · ${t.given.length}/${t.needed} given</div></div><span class="badge ${complete?'':'due'}">${complete?'Complete':'Current'}</span></div>
 ${t.notes?`<p>${esc(t.notes)}</p>`:''}
 ${t.given.length?`<div class="timeline">${t.given.map((g,i)=>`<div class="muted">Dose ${i+1}: ${fmt(g.date)} <button class="secondary" style="padding:3px 6px" onclick="undoDose('${t.id}','${g.id}')">undo</button></div>`).join('')}</div>`:''}
 <div class="smallBtns">${!complete&&!db.calves.some(c=>String(c.number).trim()===String(t.calfNumber).trim()&&calfYear(c)===currentYear&&c.deceased)?`<button onclick="giveDose('${t.id}')">✓ Mark treatment given</button>`:''}<button class="secondary" onclick="treatmentForm('${t.id}')">Edit</button><button class="danger" onclick="del('treatments','${t.id}')">Delete</button></div></div>`;
}
function renderTreatments(){
 let a=db.treatments.filter(t=>trTab==='history'?t.given.length>=t.needed:t.given.length<t.needed);
 $('#treatmentList').innerHTML=a.length?a.map(t=>treatmentCard(t)).join(''):`<div class="empty">No ${trTab==='history'?'completed':'current'} treatments.</div>`;
}
$$('[data-trtab]').forEach(b=>b.onclick=()=>{trTab=b.dataset.trtab;$$('[data-trtab]').forEach(x=>x.classList.toggle('on',x===b));renderTreatments()});

function careCard(c){
 let who=c.scope==='herd'?'Whole herd':c.scope==='count'?`${esc(c.animalCount||'?')} animals`:`Animals: ${esc(c.animalNumbers||'')}`;
 let overdue=!c.done&&c.date&&c.date<today();
 return `<div class="card"><div class="row"><div><b>${esc(c.title)}</b><div class="muted">${who} · ${c.date?'Around '+fmt(c.date):'No date set'} · ${awayText(c.date)}</div></div><span class="badge ${overdue?'bad':c.done?'':'due'}">${c.done?'Done':overdue?'Past planned date':'Upcoming'}</span></div>
 ${c.notes?`<p>${esc(c.notes)}</p>`:''}${c.done?`<div class="muted">Completed ${fmt(c.doneDate)}</div>`:''}
 <div class="smallBtns">${!c.done?`<button onclick="markCare('${c.id}')">✓ Mark done</button>`:`<button class="secondary" onclick="undoCare('${c.id}')">Undo done</button>`}<button class="secondary" onclick="careForm('${c.id}')">Edit</button><button class="danger" onclick="del('care','${c.id}')">Delete</button></div></div>`;
}
function renderCare(){let a=db.care.filter(c=>careTab==='history'?c.done:!c.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));$('#careList').innerHTML=a.length?a.map(c=>careCard(c)).join(''):`<div class="empty">No ${careTab==='history'?'care history':'upcoming care'} yet.</div>`}
$$('[data-caretab]').forEach(b=>b.onclick=()=>{careTab=b.dataset.caretab;$$('[data-caretab]').forEach(x=>x.classList.toggle('on',x===b));renderCare()});



window.showDeceased=()=>{
 const a=db.calves.filter(c=>calfYear(c)===currentYear&&c.deceased).sort((x,y)=>(y.deathDate||'').localeCompare(x.deathDate||''));
 open(`<h2>Deceased calves · ${esc(currentYear)}</h2>${a.length?a.map(c=>`<div class="card clickable" onclick="close();showProfile('${c.id}')"><div class="row"><div><b>#${esc(c.number)} ${esc(c.name||'')}</b><div class="muted">${c.deathDate?fmt(c.deathDate):'Date not recorded'}${c.deathReason?' · '+esc(c.deathReason):''}</div></div><span class="badge bad">Deceased</span></div></div>`).join(''):'<div class="empty">No deceased calves recorded for this year.</div>'}<button class="secondary" onclick="close()">Close</button>`);
}
function downloadFile(name,content,type){
 const blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function yearData(y){
 const calves=db.calves.filter(c=>calfYear(c)===y);
 const numbers=new Set(calves.map(c=>String(c.number).trim()));
 return {year:y,calves,treatments:db.treatments.filter(t=>numbers.has(String(t.calfNumber).trim())),care:db.care,groups:db.groups};
}
function reportHTML(y){
 const d=yearData(y);
 const calfBlocks=d.calves.slice().sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true})).map(c=>{
   let g=db.groups.find(x=>x.id===c.groupId);
   let sick=(c.sickness||[]).map(x=>`<li>${esc(x.reason)} — ${fmt(x.start)}${x.end?' to '+fmt(x.end):' (current)'}${x.notes?' — '+esc(x.notes):''}</li>`).join('')||'<li>None recorded</li>';
   let tr=d.treatments.filter(t=>String(t.calfNumber).trim()===String(c.number).trim()).map(t=>`<li>${esc(t.medicine)} (${esc(t.type)}) — ${esc(t.amount)} ${esc(t.unit)}, ${t.given.length}/${t.needed} given</li>`).join('')||'<li>None recorded</li>';
   return `<section><h2>#${esc(c.number)} ${esc(c.name||'')}</h2><p>${esc(c.gender||'')} ${c.colour?'· '+esc(c.colour):''}${c.dob?' · Born '+fmt(c.dob):''}</p><p><b>Group/location:</b> ${g?esc(g.name)+(g.location?' — '+esc(g.location):''):'Unassigned'}</p>${c.deceased?`<p><b>Deceased:</b> ${c.deathDate?fmt(c.deathDate):'Date not recorded'}${c.deathReason?' — '+esc(c.deathReason):''}</p>`:''}${c.notes?`<p><b>Notes:</b> ${esc(c.notes)}</p>`:''}<h3>Sickness history</h3><ul>${sick}</ul><h3>Treatment history</h3><ul>${tr}</ul></section>`;
 }).join('');
 return `<!doctype html><html><head><meta charset="utf-8"><title>MooLog ${esc(y)} Calves</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;color:#07131a;padding:0 20px}header{border-bottom:3px solid #005b3b;padding-bottom:15px}h1{color:#005b3b}section{break-inside:avoid;border-bottom:1px solid #ccc;padding:12px 0}h2{margin-bottom:3px}h3{font-size:14px;margin-bottom:3px}p,li{font-size:13px}@media print{body{margin:0}}</style>
</head><body><header><h1>MooLog — ${esc(y)} Calf Records</h1><p>PLAN. TRACK. THRIVE. · ${d.calves.length} calves</p></header>${calfBlocks||'<p>No calves recorded.</p>'}</body></html>`;
}
window.yearTools=()=>open(`<h2>${esc(currentYear)} calf records</h2><div class="choices">
<button onclick="saveYearReport()">📄 Save printable calf report</button>
<button onclick="printYearReport()">🖨️ Print calf report</button>
<button onclick="saveYearBackup()">💾 Save backup file</button>
</div><p class="muted">The printable report contains each calf's details, group/location, sickness history and treatment history. The backup file preserves the year's app data in case you need it later.</p><button class="secondary" onclick="close()">Close</button>`)
window.saveYearReport=()=>downloadFile(`MooLog-${currentYear}-calf-report.html`,reportHTML(currentYear),'text/html;charset=utf-8')
window.saveYearBackup=()=>downloadFile(`MooLog-${currentYear}-backup.json`,JSON.stringify(yearData(currentYear),null,2),'application/json')
window.printYearReport=()=>{
 const w=window.open('','_blank'); if(!w){alert('Your browser blocked the print window. Use “Save printable calf report” instead.');return}
 w.document.write(reportHTML(currentYear));w.document.close();setTimeout(()=>w.print(),250);
}
function renderAll(){renderCalves();renderGroups();renderCare();renderTreatments();if(currentCalf&&db.calves.some(c=>c.id===currentCalf))renderProfile()}
renderAll();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error));
}
</script>

</body></html>
